name: Build and release routing data

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: "23 */6 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: routing-data-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      release_needed: ${{ steps.release-plan.outputs.release_needed }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Resolve tracked upstream revisions
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python -m src.refresh_sources --sources sources.json --output resolved-sources.json

      - name: Build deterministic datasets
        run: python src/build.py --sources resolved-sources.json --output dist

      - name: Verify checksums
        run: |
          cd dist
          sha256sum -c SHA256SUMS

      - name: Fetch latest published manifest
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          python src/fetch_latest_release.py
          --repository "$GITHUB_REPOSITORY"
          --output previous/manifest.json

      - name: Evaluate release policy
        id: release-plan
        run: |
          python src/release_plan.py \
            --candidate dist/manifest.json \
            --policy release-policy.json \
            --previous previous/manifest.json \
            --output release-plan.json
          python - <<'PY'
          import json
          import os
          with open("release-plan.json", encoding="utf-8") as handle:
              needed = json.load(handle)["release_needed"]
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
              handle.write(f"release_needed={str(bool(needed)).lower()}\n")
          PY

      - name: Upload validated candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ru-routing-lists-candidate
          path: |
            dist/
            resolved-sources.json
            release-plan.json
          if-no-files-found: error
          retention-days: 7

  release:
    needs: build
    if: >-
      github.ref == 'refs/heads/main' &&
      github.event_name != 'pull_request' &&
      needs.build.outputs.release_needed == 'true'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout trusted main revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Download validated candidate
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ru-routing-lists-candidate
          path: candidate

      - name: Re-verify candidate checksums
        run: |
          cd candidate/dist
          sha256sum -c SHA256SUMS

      - name: Re-fetch latest manifest before publication
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          python src/fetch_latest_release.py
          --repository "$GITHUB_REPOSITORY"
          --output previous/manifest.json

      - name: Re-evaluate release policy
        id: final-plan
        run: |
          python src/release_plan.py \
            --candidate candidate/dist/manifest.json \
            --policy release-policy.json \
            --previous previous/manifest.json \
            --output release-plan-final.json
          python - <<'PY'
          import json
          import os
          with open("release-plan-final.json", encoding="utf-8") as handle:
              needed = json.load(handle)["release_needed"]
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
              handle.write(f"release_needed={str(bool(needed)).lower()}\n")
          PY

      - name: Prepare release metadata
        id: metadata
        if: steps.final-plan.outputs.release_needed == 'true'
        run: |
          tag="v$(date -u +%Y.%m.%d)-r${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          python src/render_release_notes.py \
            --manifest candidate/dist/manifest.json \
            --plan release-plan-final.json \
            --commit "$GITHUB_SHA" \
            --output release-notes.md

      - name: Create draft release with validated assets
        if: steps.final-plan.outputs.release_needed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.metadata.outputs.tag }}
        run: |
          gh release create "$RELEASE_TAG" \
            candidate/dist/ru-domain-suffixes.txt \
            candidate/dist/ru-ipv4-cidrs.txt \
            candidate/dist/manifest.json \
            candidate/dist/SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "$RELEASE_TAG" \
            --notes-file release-notes.md \
            --draft

      - name: Verify draft release assets
        if: steps.final-plan.outputs.release_needed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.metadata.outputs.tag }}
        run: |
          mkdir release-verify
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --dir release-verify
          python - <<'PY'
          from pathlib import Path
          expected = {
              "SHA256SUMS",
              "manifest.json",
              "ru-domain-suffixes.txt",
              "ru-ipv4-cidrs.txt",
          }
          actual = {path.name for path in Path("release-verify").iterdir() if path.is_file()}
          if actual != expected:
              raise SystemExit(f"unexpected draft release assets: {sorted(actual)}")
          PY
          cd release-verify
          sha256sum -c SHA256SUMS

      - name: Publish verified release
        if: steps.final-plan.outputs.release_needed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.metadata.outputs.tag }}
        run: gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false
