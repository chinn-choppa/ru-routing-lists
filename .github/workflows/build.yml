name: Build routing data

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: "23 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Build deterministic datasets
        run: python src/build.py --sources sources.json --output dist

      - name: Verify checksums
        run: |
          cd dist
          sha256sum -c SHA256SUMS

      - name: Upload generated datasets
        uses: actions/upload-artifact@v4
        with:
          name: ru-routing-lists-dist
          path: dist/
          if-no-files-found: error
          retention-days: 7
